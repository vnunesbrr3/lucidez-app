<html lang="pt-BR">

<style>
/* VOICE: acolhedor, animado, honesto — nunca culpa
   IDEA: um caderno-bento de bolso que responde "quanto posso gastar hoje?"
   PICTURE: o bloco menta com o número do dia; a montanha da liberdade
   COLOUR and TYPE: menta + coral (recompensa) sobre noite/névoa; Nunito nos números, sistema no texto
   LAYOUT: coluna de celular, blocos bento, abas embaixo com botão central em relevo */
:root{color-scheme:light dark;
--bg:light-dark(#F3F7F6,#0A100F);--tile:light-dark(#FFFFFF,#141C1B);--tile2:light-dark(#EEF4F2,#1A2523);
--ink:light-dark(#17302B,#F2F7F6);--sub:light-dark(#5F7773,#9FB3AF);
--pri:light-dark(#177A66,#3CC4A6);--priD:light-dark(#0D5243,#1E7D69);--onpri:light-dark(#FFFFFF,#04231C);
--coral:light-dark(#E8553F,#FF8A73);--coralT:light-dark(#C4432C,#FFA391);--coralBg:light-dark(#FDECE8,#3A1F1A);--coralBgT:light-dark(#9A2E1C,#FFC2B5);--onCoral:light-dark(#FFFFFF,#3A1208);
--amberBg:light-dark(#FAEEDA,#3A2E14);--amberT:light-dark(#854F0B,#F2C46B);
--track:light-dark(#E1EAE8,#1F2B29);--border:light-dark(#C9D8D4,#3E5450);--iconBg:light-dark(#E1F2EE,#123A31);
--sandBg:light-dark(#F4EEDF,#3A2E14);--sand:light-dark(#8A5A12,#F2C46B);--skyBg:light-dark(#E3EFF2,#12303A);--sky:light-dark(#2A6372,#7EC4D6);
--chip:light-dark(rgba(255,255,255,.2),rgba(4,35,28,.14));
--sky1:light-dark(#E1F2EE,#12201D);--mt1:light-dark(#BFE3D8,#1E3A34);--mt2:light-dark(#9FD3C4,#27493F);--mt3:light-dark(#A9D9CB,#223F38);
--r:Nunito,ui-rounded,-apple-system,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.r{font-family:var(--r)}
h1{font:800 26px/1.1 var(--r);margin:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.sm{font-size:13px;color:var(--sub)}
.tile{background:var(--tile);border-radius:26px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero{background:var(--pri);color:var(--onpri);border-radius:26px;padding:20px;border:0;text-align:left;width:100%;font:inherit;cursor:pointer;display:block}
.hero.warn{background:var(--amberBg);color:var(--amberT)}.hero.bad{background:var(--coralBg);color:var(--coralBgT)}
.big{font:900 clamp(40px,12vw,52px)/1.05 var(--r);letter-spacing:-1.5px;margin:2px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.h{background:var(--chip)}.chip.c{background:var(--coralBg);color:var(--coralBgT)}.chip.m{background:var(--iconBg);color:var(--pri)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.tt{font:800 17px/1.2 var(--r)}.num{font:800 22px/1.1 var(--r);white-space:nowrap}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:16px;background:var(--pri);border-bottom:5px solid var(--priD);color:var(--onpri);font:700 16px/1 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,border-width .08s}
.btn:active{transform:translateY(4px);border-bottom-width:1px}
.btn.full{width:100%}.btn.ghost{background:var(--tile2);color:var(--ink);border-bottom-color:var(--track)}
.lnk{background:none;border:0;color:var(--pri);font:600 14px inherit;font-family:inherit;cursor:pointer;min-height:44px;padding:0 4px}
.ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--track)}.li:last-child{border-bottom:0}
.tab{position:fixed;left:0;right:0;bottom:0;background:var(--tile);border-top:1px solid var(--track);padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-around;align-items:center;z-index:5}
.tab button{background:none;border:0;color:var(--sub);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:44px;cursor:pointer}
.tab button.on{color:var(--pri)}
.tab .plus{width:58px;height:58px;border-radius:20px;background:var(--pri);border-bottom:5px solid var(--priD);color:var(--onpri);margin-top:-26px;justify-content:center;min-width:0}
.tab .plus svg{width:26px;height:26px;stroke-width:2.4}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 24px)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{width:44px;height:44px;border-radius:22px;background:var(--tile);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
input,select,textarea{font:16px inherit;font-family:inherit;color:var(--ink);background:var(--tile);border:1.5px solid var(--track);border-radius:14px;padding:12px;min-height:48px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.seg{display:flex;background:var(--tile2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--sub);font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--tile);color:var(--ink);font-weight:700}
.ct{min-height:84px;border-radius:20px;border:2px solid var(--tile);background:var(--tile);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px inherit;font-family:inherit;cursor:pointer;padding:6px;text-align:center}
.ct.on{border-color:var(--pri)}.ct.new{background:transparent;border:2px dashed var(--border);color:var(--pri)}
.key{min-height:46px;border:0;border-radius:14px;background:var(--tile);color:var(--ink);font:600 21px var(--r);cursor:pointer}
.opt{min-height:44px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:transparent;color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer}
.opt.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card4{min-height:66px;border-radius:18px;border:0;background:var(--tile);color:var(--ink);padding:10px 12px;text-align:left;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.card4 b{font-size:15px}.card4 span{font-size:12px;color:var(--sub)}.card4.hl{outline:2px solid var(--pri)}
.coral{background:var(--coralBg);color:var(--coralBgT);border-radius:22px;padding:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--coral);color:var(--onCoral);font:800 15px var(--r);padding:10px 16px;border-radius:999px;z-index:40;pointer-events:none}
.wk{display:flex;justify-content:space-between}.wk span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--sub)}
.wk i{width:22px;height:22px;border-radius:11px;background:var(--track);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--onCoral);font-size:12px}
.wk i.on{background:var(--coral)}
.mbar{display:flex;gap:3px;align-items:flex-end;height:32px}.mbar i{flex:1;border-radius:4px}
.empty{text-align:center;padding:24px 12px;color:var(--sub)}
.banner{background:var(--amberBg);color:var(--amberT);border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:10px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.btn{transition:none}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"><p class="sm" style="padding-top:40px;text-align:center">Carregando seu Lucidez…</p></div>

<script>
{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c<0?'−':'')+'R$ '+(Math.abs(Math.round(c))/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=c=>(c<0?'−':'')+'R$ '+Math.round(Math.abs(c)/100).toLocaleString('pt-BR');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const ddiff=(a,b)=>Math.round((a-b)/864e5);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesC=d=>MES[d.getMonth()].slice(0,3)+'/'+String(d.getFullYear()).slice(2);
const toCents=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?Math.round(n*100):0};
const fmtIn=c=>c?(c/100).toFixed(2).replace('.',','):'';
const P={sun:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4',rec:'M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6',plus:'M12 5v14 M5 12h14',mtn:'M3 20l6-10 4 6 2-3 6 7z',tro:'M8 4h8v5a4 4 0 0 1-8 0z M8 6H5a3 3 0 0 0 3 4 M16 6h3a3 3 0 0 1-3 4 M12 13v4 M9 20h6',flame:'M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 2 3 0-2 0-4 1-6z',spark:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',check:'M5 12l5 5 9-10',x:'M6 6l12 12 M18 6L6 18',back:'M15 6l-6 6 6 6',chev:'M9 6l6 6-6 6',bell:'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10 21a2 2 0 0 0 4 0',bag:'M6 8h12l-1 12H7z M9 8V7a3 3 0 0 1 6 0v1',cart:'M3 4h2l2.4 11h10.2L20 8H6.2 M9 20h.01 M17 20h.01',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',bus:'M5 16V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10 M5 11h14 M7 19v-3 M17 19v-3 M5 16h14',home:'M4 11l8-7 8 7v9H4z M10 20v-5h4v5',box:'M3 8l9-5 9 5v8l-9 5-9-5z M3 8l9 5 9-5 M12 13v8',repeat:'M17 2l4 4-4 4 M3 11V9a3 3 0 0 1 3-3h15 M7 22l-4-4 4-4 M21 13v2a3 3 0 0 1-3 3H3',gift:'M4 11h16v9H4z M2 7h20v4H2z M12 7v13',heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z M4 19V5',music:'M9 18V5l11-2v13 M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3z M20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z',gym:'M3 10v4 M6 7v10 M18 7v10 M21 10v4 M6 12h12',card:'M3 6h18v12H3z M3 10h18',pause:'M9 5v14 M15 5v14',wallet:'M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z M3 7l12-4v4 M16 14h.01',pen:'M4 20h4L19 9l-4-4L4 16z',trash:'M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13',inbox:'M4 13l3-8h10l3 8v6H4z M4 13h5l1 2h4l1-2h5',target:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z'};
const ic=(k,s=20,w)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px${w?';stroke-width:'+w:''}" aria-hidden="true"><path d="${P[k]||P.spark}"/></svg>`;
const TINT={mint:['var(--iconBg)','var(--pri)'],coral:['var(--coralBg)','var(--coralT)'],sand:['var(--sandBg)','var(--sand)'],sky:['var(--skyBg)','var(--sky)'],neutral:['var(--tile2)','var(--sub)']};
const ICONS=['bag','cart','star','bus','home','box','repeat','gift','heart','book','music','gym'];
const normKey=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(pg|pag|pix|mp|ifd)\s*\*?\s*/,'').replace(/[*#\d]+/g,' ').replace(/[^a-z ]/g,' ').trim().split(/\s+/).slice(0,2).join(' ');

/* ---------- estado ---------- */
const DEF=()=>({v:1,setup:false,demo:false,name:'',salary:0,balance:0,payRule:'nth',payN:5,payDay:5,sat:true,vr:0,vrBal:0,cardOpen:0,reserve:0,extra:0,strategy:'snowball',
 pots:[{id:'ess',name:'Essencial',kind:'essential',budget:0},{id:'mer',name:'Mercado',kind:'groceries',budget:0},{id:'laz',name:'Delivery e lazer',kind:'leisure',budget:0},{id:'ass',name:'Assinaturas',kind:'subs',budget:0}],
 cats:[{id:'c1',name:'Delivery',icon:'bag',tint:'coral',pot:'laz',imp:1},{id:'c2',name:'Mercado',icon:'cart',tint:'mint',pot:'mer'},{id:'c3',name:'Lazer',icon:'star',tint:'sand',pot:'laz',imp:1},{id:'c4',name:'Transporte',icon:'bus',tint:'sky',pot:'ess'},{id:'c5',name:'Essencial',icon:'home',tint:'neutral',pot:'ess'},{id:'c6',name:'Compras online',icon:'box',tint:'coral',pot:'laz',imp:1},{id:'c7',name:'Assinaturas',icon:'repeat',tint:'sand',pot:'ass'}],
 rules:{},tx:[],bills:[],debts:[],pays:[],goals:[],pts:[],days:[],md:{},ach:{},saved:0,salaryDone:{},feel:{}});
let S=DEF(),ref=null,saving=false,dirty=false,cloud=true,sample=null,desktop=null;
const LS='lucidez-v1';
function save(){dirty=true;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(!ref)return; clearTimeout(save.t); save.t=setTimeout(flush,700)}
async function flush(){if(!ref||saving||!dirty)return;saving=true;dirty=false;
 try{await ref.set(JSON.parse(JSON.stringify(S)))}catch(e){dirty=true}saving=false;if(dirty)save()}

/* ---------- calendário ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const holCache={};
function hols(y){if(holCache[y])return holCache[y];const s=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));const e=easter(y);e.setDate(e.getDate()-2);s.add(iso(e));return holCache[y]=s}
function payday(y,m){const dim=new Date(y,m+1,0).getDate();
 if(S.payRule==='fixed')return new Date(y,m,Math.min(S.payDay,dim));
 let n=0;for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),w=dt.getDay();if(w===0||(w===6&&!S.sat)||hols(y).has(iso(dt)))continue;if(++n===S.payN)return dt}return new Date(y,m,dim)}
function cycle(){const t=today(),y=t.getFullYear(),m=t.getMonth();let p=payday(y,m),start,next;
 if(t<p){start=payday(y,m-1<0?11:m-1);if(m===0)start=payday(y-1,11);next=p}else{start=p;next=m===11?payday(y+1,0):payday(y,m+1)}
 return{start,next,key:iso(start),left:Math.max(1,ddiff(next,t)),len:Math.max(1,ddiff(next,start)),passed:ddiff(t,start)}}
function dueIn(day,c){for(const base of [c.start,c.next]){const y=base.getFullYear(),m=base.getMonth();const d=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));if(d>=c.start&&d<c.next)return d}return null}

/* ---------- motor financeiro ---------- */
const catOf=id=>S.cats.find(c=>c.id===id);
function calc(){const c=cycle(),t=iso(today());
 const bills=S.bills.filter(b=>dueIn(b.day,c)&&!(b.paid||{})[c.key]).reduce((s,b)=>s+b.amount,0);
 const inst=S.debts.filter(d=>d.mode==='fixed'&&!d.payroll&&d.bal>0&&d.inst>0&&d.due&&dueIn(d.due,c)&&d.paidCycle!==c.key).reduce((s,d)=>s+Math.min(d.inst,d.bal),0);
 const extraPaid=S.pays.filter(p=>p.extra&&p.date>=c.key).reduce((s,p)=>s+p.amt,0);
 const extra=Math.max(0,S.extra-extraPaid);
 const goals=S.goals.filter(g=>g.saved<g.price).reduce((s,g)=>s+g.weekly*Math.ceil(c.left/7),0);
 const free=S.balance-S.cardOpen-bills-inst-extra-goals-S.reserve;
 const spentToday=S.tx.filter(x=>x.date===t&&x.pay!=='vr').reduce((s,x)=>s+x.amt,0);
 const dayBudget=Math.floor((free+spentToday)/c.left);
 const left=dayBudget-spentToday;
 const state=free<0?'bad':(left<0.3*Math.max(dayBudget,1)?'warn':'ok');
 return{c,bills,inst,extra,goals,free,spentToday,dayBudget,left,state}}
function potInfo(c){return S.pots.map(p=>{const spent=S.tx.filter(x=>x.date>=c.key&&x.pay!=='vr'&&catOf(x.cat)?.pot===p.id).reduce((s,x)=>s+x.amt,0);
 const rest=p.budget-spent,pct=p.budget?Math.max(0,Math.min(1,rest/p.budget)):0,used=p.budget?spent/p.budget:0,time=c.passed/c.len;
 const st=!p.budget?'off':rest<0.2*p.budget?'low':used<=time+0.1?'ok':'att';return{...p,spent,rest,pct,st}})}
function capDaily(){const m=S.debts.filter(d=>d.bal>0).reduce((s,d)=>s+(d.inst||0),0)+S.extra;return m/30}
function freedomDays(amt){const d=capDaily();return d>0?amt/d:0}
function sim(extra,strategy,lump=0){const ds=S.debts.filter(d=>d.bal>0).map(d=>{let inst=d.inst||0;
  if(d.mode==='flex'){if(!d.target)return null;const mo=Math.max(1,ddiff(pd(d.target),today())/30.4);inst=Math.ceil(d.bal/mo)}

async function lumeAI(){const box=$('#lai');if(!box||!sample)return;box.innerHTML='<p class="sm">O Lume está pensando…</p>';
 const pl=potInfo(cycle()).find(p=>p.id==='laz');
 const prompt=`Você é o Lume, guia de finanças comportamentais de um app pessoal para uma pessoa com TDAH que quer sair do ciclo de dívidas. Regras: tom acolhedor e animado, sem culpa; traga UM contraponto honesto e uma pergunta que estimule pensamento crítico; nunca sugira empréstimo, cartão ou parcelamento como solução; no máximo 2 frases curtas em português do Brasil; sem emojis.
Dados: item: ${L.item}; preço: ${brl(L.price)}; resposta "problema ou vontade": ${L.ans}; "se esperar 2 semanas ainda quer": ${L.wait||'não respondeu'}; saldo do pote de lazer: ${pl?brl(pl.rest):'não definido'}; a compra adia o Dia da Liberdade em cerca de ${Math.round(freedomDays(L.price))} dias.`;
 try{const r=await sample(prompt,{modelTier:'quick'});let t=(r&&r.text||'').trim();if(!t||/empr[ée]stimo|parcel|cart[aã]o/i.test(t))t='Vale dormir sobre essa decisão: se amanhã a vontade continuar igual, ela merece um plano, não um impulso.';L.ai=t.slice(0,400);lumeRender()}
 catch(e){box.innerHTML=`<p class="sm">${e&&e.code==='not_granted'?'Sem permissão para a IA agora. O contraponto acima continua valendo.':'A IA não respondeu agora. Tente de novo mais tarde.'}</p>`}}
function lumeOpt(v){L.opt=v;
 if(v==='agora'){openReg({cents:L.price,merchant:L.item});return}
 if(v==='plan'){const w=Math.ceil(L.price/8/100)*100;S.goals.push({id:uid(),title:L.item,price:L.price,weekly:w,saved:0});addPts(30,'planejar');mission('lume');L.msg='Meta criada! Em 8 semanas é seu, sem dívida. Ela já está reservada no "pode gastar hoje".';save()}
 if(v==='parc'){const n=10;L.msg=`${n}x de ${brl(Math.ceil(L.price/n))}: a compra pesa no seu mês até ${MES[addM(n).getMonth()]}. Parcelar não deixa mais barato, só espalha o peso.`}
 if(v==='des'){S.saved+=L.price;addPts(50,'desistir');mission('lume');unlock('lume_no');if(S.saved>=100000)unlock('saved1000');L.msg=`${brl0(L.price)} foram para o seu "economizado com lucidez". Que orgulho!`;save()}
