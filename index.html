:root{color-scheme:light dark;
--bg:light-dark(#F5F3FF,#0E0B24);--tile:light-dark(#FFFFFF,#18143A);--tile2:light-dark(#EFECFF,#221D4C);
--ink:light-dark(#1C1640,#F3F1FF);--sub:light-dark(#6C66A0,#A9A3D6);

--coral:light-dark(#FFB020,var(--gold));--coralT:light-dark(#A85A00,#FFD36E);--coralBg:light-dark(#FFF1D6,#3A2D0E);--coralBgT:light-dark(#8A4A00,#FFD98A);--onCoral:light-dark(#2A1B00,#2A1B00);
--amberBg:light-dark(#FFE9E2,#3D1E22);--amberT:light-dark(#A33A1E,#FF9F8A);
--track:light-dark(#E2DEFF,#2A2457);--border:light-dark(#CFC9F5,#3C3577);--iconBg:light-dark(#ECE9FF,#26205A);
--sandBg:light-dark(#FFF1D6,#3A2D0E);--sand:light-dark(#A85A00,#FFD36E);--skyBg:light-dark(#DDF6EE,#0F3A33);--sky:light-dark(#0B7A5C,#4FE0B4);

--gold:#FFC83D;--glow:rgba(255,200,61,.18);--gw:linear-gradient(140deg,#C2410C,#FF7A1A);--gb:linear-gradient(140deg,#7A2E3B,#B8485A);--g1:linear-gradient(140deg,#2D1FA3,#5B3DF5);--g2:linear-gradient(140deg,#0E9F6E,#14B8A6);--g3:linear-gradient(140deg,#FFB020,#FF7A1A);
--sky1:light-dark(#ECE9FF,#14102F);--mt1:light-dark(#D6D0FF,#2A2360);--mt2:light-dark(#BEB5FF,#352C78);--mt3:light-dark(#CBC4FF,#2F2770);
--r:Sora,ui-rounded,-apple-system,sans-serif;--sys:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

*{box-sizing:border-box;min-width:0}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease both}
.ov.out{animation:fadeOut .22s ease both}.ov.out .sheet{animation:slideDown .24s cubic-bezier(.4,0,1,1) both}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);animation:slideUp .38s cubic-bezier(.2,.9,.25,1) both;will-change:transform}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:2px auto 12px;touch-action:none}

@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.view{animation:viewIn .28s ease both}
.tile,.hero,.ct,.card4,.key,.opt,.tab button,.li{transition:transform .12s ease}
button.tile:active,.hero:active,.ct:active,.card4:active,.key:active,.opt:active,button.li:active{transform:scale(.97)}.tab button:active{transform:scale(.9)}
.top{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;text-align:center;font:700 16px var(--sys);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--track);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}.top.on{opacity:1;transform:none}
.splash{min-height:70vh;display:flex;align-items:center;justify-content:center}
.inst{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:14px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
input,select,textarea{font:16px var(--sys);font-family:inherit;color:var(--ink);background:var(--tile);border:1.5px solid var(--track);border-radius:14px;padding:12px;min-height:48px;width:100%}

.opt.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card4{min-height:66px;border-radius:18px;border:0;background:var(--tile);color:var(--ink);padding:10px 12px;text-align:left;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.card4 b{font-size:15px}.card4 span{font-size:12px;color:var(--sub)}.card4.hl{outline:2px solid var(--pri)}
.coral{background:var(--coralBg);color:var(--coralBgT);border-radius:22px;padding:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .3s cubic-bezier(.2,.9,.25,1) both;transform:translateX(-50%);background:var(--coral);color:var(--onCoral);font:800 15px var(--r);padding:10px 16px;border-radius:999px;z-index:40;pointer-events:none}
.wk{display:flex;justify-content:space-between}.wk span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--sub)}
.wk i{width:22px;height:22px;border-radius:11px;background:var(--track);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--onCoral);font-size:12px}
.wk i.on{background:var(--coral)}
.mbar{display:flex;gap:3px;align-items:flex-end;height:32px}.mbar i{flex:1;border-radius:4px}
.empty{text-align:center;padding:24px 12px;color:var(--sub)}
.banner{background:var(--amberBg);color:var(--amberT);border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:10px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.btn{transition:none}}
.hide{display:none!important}
</style>

/* ---------- calendário ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const holCache={};
function hols(y){if(holCache[y])return holCache[y];const s=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));const e=easter(y);e.setDate(e.getDate()-2);s.add(iso(e));return holCache[y]=s}
function payday(y,m){const dim=new Date(y,m+1,0).getDate();
 if(S.payRule==='fixed')return new Date(y,m,Math.min(S.payDay,dim));
 let n=0;for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),w=dt.getDay();if(w===0||(w===6&&!S.sat)||hols(y).has(iso(dt)))continue;if(++n===S.payN)return dt}return new Date(y,m,dim)}
function cycle(){const t=today(),y=t.getFullYear(),m=t.getMonth();let p=payday(y,m),start,next;
 if(t<p){start=payday(y,m-1<0?11:m-1);if(m===0)start=payday(y-1,11);next=p}else{start=p;next=m===11?payday(y+1,0):payday(y,m+1)}
 return{start,next,key:iso(start),left:Math.max(1,ddiff(next,t)),len:Math.max(1,ddiff(next,start)),passed:ddiff(t,start)}}
function dueIn(day,c){for(const base of [c.start,c.next]){const y=base.getFullYear(),m=base.getMonth();const d=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));if(d>=c.start&&d<c.next)return d}return null}

/* ---------- motor financeiro ---------- */
const catOf=id=>S.cats.find(c=>c.id===id);
function calc(){const c=cycle(),t=iso(today());
 const bills=S.bills.filter(b=>dueIn(b.day,c)&&!(b.paid||{})[c.key]).reduce((s,b)=>s+b.amount,0);
 const inst=S.debts.filter(d=>d.mode==='fixed'&&!d.payroll&&d.bal>0&&d.inst>0&&d.due&&dueIn(d.due,c)&&d.paidCycle!==c.key).reduce((s,d)=>s+Math.min(d.inst,d.bal),0);
 const extraPaid=S.pays.filter(p=>p.extra&&p.date>=c.key).reduce((s,p)=>s+p.amt,0);
 const extra=Math.max(0,S.extra-extraPaid);
 const goals=S.goals.filter(g=>g.saved<g.price).reduce((s,g)=>s+g.weekly*Math.ceil(c.left/7),0);
 const free=S.balance-S.cardOpen-bills-inst-extra-goals-S.reserve;
 const spentToday=S.tx.filter(x=>x.date===t&&x.pay!=='vr').reduce((s,x)=>s+x.amt,0);
 const dayBudget=Math.floor((free+spentToday)/c.left);
 const left=dayBudget-spentToday;
 const state=free<0?'bad':(left<0.3*Math.max(dayBudget,1)?'warn':'ok');
 return{c,bills,inst,extra,goals,free,spentToday,dayBudget,left,state}}
function potInfo(c){return S.pots.map(p=>{const spent=S.tx.filter(x=>x.date>=c.key&&x.pay!=='vr'&&catOf(x.cat)?.pot===p.id).reduce((s,x)=>s+x.amt,0);
 const rest=p.budget-spent,pct=p.budget?Math.max(0,Math.min(1,rest/p.budget)):0,used=p.budget?spent/p.budget:0,time=c.passed/c.len;
 const st=!p.budget?'off':rest<0.2*p.budget?'low':used<=time+0.1?'ok':'att';return{...p,spent,rest,pct,st}})}
function capDaily(){const m=S.debts.filter(d=>d.bal>0).reduce((s,d)=>s+(d.inst||0),0)+S.extra;return m/30}
function freedomDays(amt){const d=capDaily();return d>0?amt/d:0}
function sim(extra,strategy,lump=0){const ds=S.debts.filter(d=>d.bal>0).map(d=>{let inst=d.inst||0;
  if(d.mode==='flex'){if(!d.target)return null;const mo=Math.max(1,ddiff(pd(d.target),today())/30.4);inst=Math.ceil(d.bal/mo)}
  return{id:d.id,bal:d.bal,r:(d.rate||0)/100,inst}}).filter(Boolean);
 if(!ds.length)return{months:0,interest:0,done:{},skipped:S.debts.filter(d=>d.bal>0).length};
 let rem=lump;const order=()=>ds.filter(d=>d.bal>0).sort((a,b)=>strategy==='avalanche'?(b.r-a.r)||(a.bal-b.bal):(a.bal-b.bal)||(b.r-a.r));
 for(const d of order()){if(rem<=0)break;const p=Math.min(rem,d.bal);d.bal-=p;rem-=p}
 let I=0,freed=0;const done={};
 for(let m=1;m<=480;m++){let pool=extra+freed;
  for(const d of ds){if(d.bal<=0)continue;const it=d.bal*d.r;d.bal+=it;I+=it;const p=Math.min(d.inst,d.bal);d.bal-=p;if(d.bal<=50){d.bal=0;done[d.id]=m;freed+=d.inst}}
  for(const d of order()){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p;if(d.bal<=50){d.bal=0;done[d.id]=m;freed+=d.inst}}
  if(ds.every(d=>d.bal<=0))return{months:m,interest:Math.round(I),done,skipped:S.debts.filter(d=>d.bal>0&&d.mode==='flex'&&!d.target).length}}
 return{months:null,interest:Math.round(I),done,skipped:0}}
const addM=n=>{const t=today();return new Date(t.getFullYear(),t.getMonth()+n,1)};
const freeDate=n=>n==null?'sem data':n===0?'hoje':MES[addM(n).getMonth()]+' de '+addM(n).getFullYear();
function progress(){const init=S.debts.reduce((s,d)=>s+(d.init||d.bal),0),bal=S.debts.reduce((s,d)=>s+d.bal,0);return init?Math.max(0,Math.min(1,1-bal/init)):0}

const POOL=[['reg','Registrar um gasto',10],['lume','Pensar antes de comprar',20],['potes','Dar uma olhada nos potes',10],['pay','Registrar um pagamento de dívida',20],['sim','Rodar o simulador',10],['saldo','Conferir o saldo em conta',10],['open','Abrir o Lucidez hoje',10]];
function missions(){const k=iso(today());let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%9973;const pick=['open'];const rest=POOL.filter(p=>p[0]!=='open');
 while(pick.length<3){const p=rest[h%rest.length][0];if(!pick.includes(p))pick.push(p);h=(h*7+3)%9973}
 const done=S.md[k]||[];return pick.map(id=>{const p=POOL.find(x=>x[0]===id);return{id,t:p[1],p:p[2],done:done.includes(id)}})}
function mission(id){const k=iso(today());const ms=missions();if(!ms.some(m=>m.id===id))return;S.md[k]=S.md[k]||[];if(S.md[k].includes(id))return;S.md[k].push(id);const m=ms.find(x=>x.id===id);setTimeout(()=>addPts(m.p,'missão'),900)}
